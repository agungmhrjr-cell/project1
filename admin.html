<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHRJR STORE - Admin</title>
<style>
 <link rel="stylesheet" href="css/style.css">
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#090d12;color:#fff}header{background:#0d1117;border-bottom:1px solid #252d38;padding:16px 22px}main{max-width:1100px;margin:auto;padding:30px 20px}h1{margin:0 0 6px}.muted{color:#94a3b8}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:25px}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:bold}.logout{background:#dc2626;color:#fff}.stat{background:#11161d;border:1px solid #252d38;border-radius:15px;padding:20px;margin-bottom:20px}.number{font-size:34px;font-weight:900;color:#60a5fa}.table{overflow:auto;background:#11161d;border:1px solid #252d38;border-radius:15px}table{width:100%;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #252d38;white-space:nowrap}th{color:#94a3b8;font-size:13px}.msg{padding:15px;border-radius:10px;background:#ef44441c;color:#fca5a5}
</style></head>
<body><header><div class="top" style="max-width:1100px;margin:auto"><div><b><span style="color:#ef4444">MHRJR</span> <span style="color:#3b82f6">STORE</span></b> <span class="muted"> / Admin</span></div><button class="logout" id="logout">Keluar</button></div></header>
<main><div class="top"><div><h1>Dashboard Pelanggan</h1><div class="muted">Daftar akun yang sudah mendaftar.</div></div><button onclick="loadUsers()">Refresh</button></div>
<div class="stat"><div class="muted">Total pelanggan</div><div class="number" id="total">-</div></div>
<div id="status"></div>
<div class="table"><table><thead><tr><th>Nama</th><th>Email</th><th>Tanggal Daftar</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase=window.supabase.createClient('https://evqjtwnffzpuucbcxmgx.supabase.co','sb_publishable_PqixNwuQtUKMn2LEhtYQgg_dOg2wEK0');
async function loadUsers(){
 const {data:{user}}=await supabase.auth.getUser();
 if(!user){location.href='login.html';return}
 const {data,error}=await supabase.from('profiles').select('name,email,created_at').order('created_at',{ascending:false});
 if(error){document.getElementById('status').innerHTML='<div class="msg">Gagal mengambil data. Pastikan SQL dan RLS sudah dipasang.</div>';return}
 document.getElementById('total').textContent=data.length;
 document.getElementById('rows').innerHTML=data.map(u=>`<tr><td>${escapeHtml(u.name||'-')}</td><td>${escapeHtml(u.email)}</td><td>${new Date(u.created_at).toLocaleString('id-ID')}</td></tr>`).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='login.html'};
loadUsers();
</script></body></html>
